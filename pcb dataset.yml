# PCB Defect Detection — YOLOv8 dataset config
#
# Based on the standard PCB defect taxonomy used by the widely-cited
# open PCB Defect Dataset (Peking University) and its Roboflow mirrors:
# https://universe.roboflow.com/ (search "PCB Defect Dataset")
#
# Expected folder layout after downloading/exporting from Roboflow in
# YOLOv8 format:
#
#   pcb-defect-dataset/
#     train/
#       images/*.jpg
#       labels/*.txt
#     valid/
#       images/*.jpg
#       labels/*.txt
#     test/
#       images/*.jpg
#       labels/*.txt
#
# Each .txt label file uses YOLO format:
#   <class_id> <x_center> <y_center> <width> <height>   (all normalized 0-1)

path: ../data/pcb-defect-dataset   # dataset root, relative to this file
train: train/images
val: valid/images
test: test/images

names:
  0: missing_hole
  1: mouse_bite
  2: open_circuit
  3: short
  4: spur
  5: spurious_copper

# Class notes (for reference when reviewing predictions):
# missing_hole     - drilled hole that should exist but is absent
# mouse_bite       - small semi-circular notch eaten into a copper trace/pad
# open_circuit     - a trace that is broken/disconnected where it should be continuous
# short            - unintended copper bridge connecting two traces that should be separate
# spur             - unwanted stray copper extending off a trace
# spurious_copper  - unwanted copper blob/island not part of the intended circuit
